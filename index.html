<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atualidades</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #07111f;
    color: #ffffff;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   CABEÇALHO
========================= */

header {

    height: 9vh;

    min-height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 2.5vw;

    background: #0c1b2e;

    border-bottom: 2px solid #24364d;
}

.logo {

    font-size: clamp(24px, 2.2vw, 42px);

    font-weight: 800;

    letter-spacing: -1px;
}

.logo span {
    color: #4da3ff;
}

.datetime {

    text-align: right;
}

.date {

    font-size: clamp(14px, 1.1vw, 22px);

    color: #9fb1c5;

}

.time {

    font-size: clamp(24px, 2vw, 38px);

    font-weight: 700;

}

/* =========================
   ÁREA PRINCIPAL
========================= */

main {

    height: 91vh;

    padding: 1.4vh 2vw;

    display: grid;

    grid-template-columns:
        2fr
        1fr;

    grid-template-rows:
        1fr
        1fr;

    gap: 1.2vw;

}

/* =========================
   PAINEL PRINCIPAL
========================= */

.feature {

    grid-row: span 2;

    background: #0d2036;

    border-radius: 10px;

    padding: 2vw;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    position: relative;

}

.feature::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            transparent 30%,
            rgba(0,0,0,.8) 100%
        );

    pointer-events: none;

}

.feature-content {

    position: relative;

    z-index: 2;

}

.category {

    color: #4da3ff;

    font-size: clamp(13px, 1vw, 20px);

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 1vh;

}

.feature h1 {

    margin: 0;

    font-size: clamp(30px, 3vw, 60px);

    line-height: 1.08;

    letter-spacing: -1px;

}

.feature p {

    margin:

        1.5vh
        0
        0;

    color: #c5d2df;

    font-size: clamp(15px, 1.2vw, 25px);

    line-height: 1.35;

}

/* =========================
   CARDS
========================= */

.panel {

    background: #0d2036;

    border-radius: 10px;

    padding: 1.4vw;

    overflow: hidden;

}

.panel-title {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: clamp(17px, 1.3vw, 26px);

    font-weight: 800;

    margin-bottom: 1vh;

    padding-bottom: 0.8vh;

    border-bottom: 2px solid #263d56;

}

.panel-title span {

    color: #4da3ff;

}

/* =========================
   NOTÍCIAS
========================= */

.news-list {

    display: flex;

    flex-direction: column;

    gap: 1vh;

}

.news-item {

    padding-bottom: 0.8vh;

    border-bottom: 1px solid #20364d;

}

.news-title {

    font-size: clamp(14px, 1.05vw, 21px);

    font-weight: 700;

    line-height: 1.2;

}

.news-summary {

    margin-top: 0.3vh;

    color: #9fb1c5;

    font-size: clamp(11px, .75vw, 15px);

    line-height: 1.25;

}

.news-source {

    margin-top: 0.3vh;

    color: #5d8db9;

    font-size: clamp(9px, .6vw, 12px);

}

/* =========================
   RODAPÉ
========================= */

footer {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 4vh;

    min-height: 28px;

    background: #07111f;

    border-top: 1px solid #20364d;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #72869c;

    font-size: clamp(9px, .65vw, 13px);

}

/* =========================
   RESPONSIVIDADE
========================= */

@media (max-width: 900px) {

    main {

        grid-template-columns: 1fr;

        grid-template-rows:
            1fr
            1fr
            1fr;

        overflow: auto;

    }

    .feature {

        grid-row: auto;

    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        ATUALIDADES<span>.</span>
    </div>

    <div class="datetime">

        <div
            class="date"
            id="date">
        </div>

        <div
            class="time"
            id="time">
        </div>

    </div>

</header>


<main>


    <!-- =========================
         MANCHETE PRINCIPAL
    ========================== -->

    <section class="feature">

        <div
            class="feature-content"
            id="feature">

            <div class="category">
                PRINCIPAL
            </div>

            <h1>
                Carregando principais notícias...
            </h1>

            <p>
                Aguarde a atualização das notícias.
            </p>

        </div>

    </section>


    <!-- =========================
         BRASIL
    ========================== -->

    <section class="panel">

        <div class="panel-title">
            <span>●</span>
            BRASIL
        </div>

        <div
            class="news-list"
            id="brasil">

            Carregando...

        </div>

    </section>


    <!-- =========================
         ECONOMIA
    ========================== -->

    <section class="panel">

        <div class="panel-title">
            <span>●</span>
            ECONOMIA
        </div>

        <div
            class="news-list"
            id="economia">

            Carregando...

        </div>

    </section>


</main>


<footer>

    Notícias atualizadas automaticamente
    •
    Painel de Atualidades

</footer>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const CONFIG = {

    /*
     * Google News fornece RSS por assunto.
     *
     * O idioma pt-BR e o país BR são definidos
     * diretamente na URL.
     */

    feeds: {

        brasil:
            "https://news.google.com/rss/search?q=Brasil&hl=pt-BR&gl=BR&ceid=BR:pt-419",

        economia:
            "https://news.google.com/rss/search?q=Economia&hl=pt-BR&gl=BR&ceid=BR:pt-419",

        mundo:
            "https://news.google.com/rss/search?q=Mundo&hl=pt-BR&gl=BR&ceid=BR:pt-419",

        esportes:
            "https://news.google.com/rss/search?q=Esportes&hl=pt-BR&gl=BR&ceid=BR:pt-419"

    },

    /*
     * Atualiza a cada 5 minutos.
     */

    refresh:
        5 * 60 * 1000

};


/* =====================================================
   RELÓGIO
===================================================== */

function atualizarRelogio() {

    const agora = new Date();

    const data = agora.toLocaleDateString(
        "pt-BR",
        {
            weekday: "long",
            day: "2-digit",
            month: "long"
        }
    );

    const hora = agora.toLocaleTimeString(
        "pt-BR",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

    document.getElementById("date")
        .textContent =
        data.charAt(0).toUpperCase()
        + data.slice(1);

    document.getElementById("time")
        .textContent =
        hora;

}

atualizarRelogio();

setInterval(
    atualizarRelogio,
    1000
);


/* =====================================================
   RSS
===================================================== */

async function carregarRSS(
    url
) {

    /*
     * Proxy público para permitir que
     * uma página GitHub Pages consulte RSS.
     */

    const proxy =
        "https://api.allorigins.win/raw?url="
        + encodeURIComponent(url);

    const resposta =
        await fetch(proxy);

    if (!resposta.ok) {

        throw new Error(
            "Falha ao acessar RSS"
        );

    }

    const texto =
        await resposta.text();

    const parser =
        new DOMParser();

    const xml =
        parser.parseFromString(
            texto,
            "text/xml"
        );

    return [
        ...xml.querySelectorAll("item")
    ];

}


/* =====================================================
   LIMPEZA DO TEXTO
===================================================== */

function limparTexto(texto) {

    if (!texto) return "";

    const div =
        document.createElement("div");

    div.innerHTML = texto;

    return (
        div.textContent ||
        div.innerText ||
        ""
    )
    .replace(/\s+/g, " ")
    .trim();

}


/* =====================================================
   RENDERIZA NOTÍCIAS
===================================================== */

function renderizarNoticias(
    noticias,
    elemento
) {

    elemento.innerHTML = "";

    noticias
        .slice(0, 4)
        .forEach(
            noticia => {

                const titulo =
                    limparTexto(
                        noticia.querySelector("title")
                            ?.textContent
                    );

                const descricao =
                    limparTexto(
                        noticia.querySelector("description")
                            ?.textContent
                    );

                const fonte =
                    limparTexto(
                        noticia.querySelector("source")
                            ?.textContent
                    );

                const item =
                    document.createElement("div");

                item.className =
                    "news-item";

                item.innerHTML = `

                    <div class="news-title">
                        ${titulo}
                    </div>

                    ${
                        descricao
                        ?
                        `
                        <div class="news-summary">
                            ${descricao.substring(
                                0,
                                140
                            )}
                        </div>
                        `
                        :
                        ""
                    }

                    ${
                        fonte
                        ?
                        `
                        <div class="news-source">
                            ${fonte}
                        </div>
                        `
                        :
                        ""
                    }

                `;

                elemento.appendChild(item);

            }
        );

}


/* =====================================================
   MANCHETE
===================================================== */

function renderizarPrincipal(
    noticia
) {

    if (!noticia) return;

    const titulo =
        limparTexto(
            noticia.querySelector("title")
                ?.textContent
        );

    const descricao =
        limparTexto(
            noticia.querySelector("description")
                ?.textContent
        );

    const fonte =
        limparTexto(
            noticia.querySelector("source")
                ?.textContent
        );

    document.getElementById(
        "feature"
    ).innerHTML = `

        <div class="category">
            PRINCIPAL
        </div>

        <h1>
            ${titulo}
        </h1>

        <p>
            ${
                descricao
                ?
                descricao.substring(
                    0,
                    300
                )
                :
                ""
            }
        </p>

        <div
            class="news-source"
            style="margin-top:1vh">

            ${fonte}

        </div>

    `;

}


/* =====================================================
   CARREGAMENTO PRINCIPAL
===================================================== */

async function atualizarNoticias() {

    try {

        const brasil =
            await carregarRSS(
                CONFIG.feeds.brasil
            );

        const economia =
            await carregarRSS(
                CONFIG.feeds.economia
            );

        renderizarPrincipal(
            brasil[0]
        );

        renderizarNoticias(
            brasil,
            document.getElementById(
                "brasil"
            )
        );

        renderizarNoticias(
            economia,
            document.getElementById(
                "economia"
            )
        );

    }

    catch (erro) {

        console.error(
            erro
        );

        document.getElementById(
            "brasil"
        ).innerHTML =
            "Não foi possível atualizar as notícias.";

        document.getElementById(
            "economia"
        ).innerHTML =
            "Tentando novamente...";

    }

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

atualizarNoticias();

setInterval(
    atualizarNoticias,
    CONFIG.refresh
);

</script>


</body>
</html>
